<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Motion Dice</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="dice-stage">
    <div class="dice-face">
      {{ number() }}
    </div>
    <p class="dice-hint">Shake the phone along the X axis to roll</p>
  </div>
</ion-content>
